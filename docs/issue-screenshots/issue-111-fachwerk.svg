<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <title>Issue #111 — Fachwerk timber-raster overlay (v0)</title>
  <desc>
    v0 of issue #111 ships a parametric overlay: when a wall declares a
    `fachwerkPattern`, the renderer draws dark-timber Ständer (posts),
    Schwelle/Rähm (sill/top-plate), optional mid-rails (Geschossriegel)
    and Streben (diagonals) ~10 mm proud of the wall face. The wall's
    own materialKey provides the Gefache infill (brick_red shown left,
    plaster shown right). Per-Ständer geometric authoring is deferred.
  </desc>
  <style>
    .title { font: bold 16px/1.2 sans-serif; fill: #111; text-anchor: middle; }
    .label { font: 13px/1.2 sans-serif; fill: #222; text-anchor: middle; }
    .key   { font: 11px/1.2 monospace; fill: #555; text-anchor: middle; }
    .anno  { font: 11px/1.2 monospace; fill: #777; }
  </style>

  <text class="title" x="450" y="26">Issue #111 — Fachwerk timber-raster overlay (v0)</text>
  <text class="label" x="450" y="46">brick_red Gefache (left) and plaster Gefache (right) — overlay is identical</text>

  <!-- ── Left facade: brick infill ─────────────────────────────────────── -->
  <g transform="translate(40,80)">
    <!-- Wall + brick infill -->
    <rect x="0" y="0" width="380" height="280" fill="#8a3a26"/>
    <!-- Faint brick courses to read as masonry without authoring per brick -->
    <g stroke="#6f2a18" stroke-width="0.6" opacity="0.6">
      <line x1="0" y1="20" x2="380" y2="20"/>
      <line x1="0" y1="40" x2="380" y2="40"/>
      <line x1="0" y1="60" x2="380" y2="60"/>
      <line x1="0" y1="80" x2="380" y2="80"/>
      <line x1="0" y1="100" x2="380" y2="100"/>
      <line x1="0" y1="120" x2="380" y2="120"/>
      <line x1="0" y1="140" x2="380" y2="140"/>
      <line x1="0" y1="160" x2="380" y2="160"/>
      <line x1="0" y1="180" x2="380" y2="180"/>
      <line x1="0" y1="200" x2="380" y2="200"/>
      <line x1="0" y1="220" x2="380" y2="220"/>
      <line x1="0" y1="240" x2="380" y2="240"/>
      <line x1="0" y1="260" x2="380" y2="260"/>
    </g>

    <!-- Fachwerk timber overlay (timber_dark_oak #3a2418) -->
    <g fill="#3a2418">
      <!-- Schwelle (sill) -->
      <rect x="0" y="260" width="380" height="20"/>
      <!-- Rähm (top plate) -->
      <rect x="0" y="0" width="380" height="20"/>
      <!-- Mid-rail (Geschossriegel) at mid-height -->
      <rect x="0" y="135" width="380" height="14"/>
      <!-- 5 Ständer (posts) at 0 / 95 / 190 / 285 / 380 -->
      <rect x="0"   y="20" width="14" height="115"/>
      <rect x="0"   y="149" width="14" height="111"/>
      <rect x="90"  y="20" width="14" height="115"/>
      <rect x="90"  y="149" width="14" height="111"/>
      <rect x="183" y="20" width="14" height="115"/>
      <rect x="183" y="149" width="14" height="111"/>
      <rect x="276" y="20" width="14" height="115"/>
      <rect x="276" y="149" width="14" height="111"/>
      <rect x="366" y="20" width="14" height="115"/>
      <rect x="366" y="149" width="14" height="111"/>
      <!-- Streben — vee pattern, alternating per bay, top + bottom rows -->
      <g>
        <!-- top row: bays 1,3 lean left; bays 2,4 lean right -->
        <rect x="14"  y="74" width="76" height="11" transform="rotate(-50,52,80)"/>
        <rect x="104" y="74" width="79" height="11" transform="rotate(50,143,80)"/>
        <rect x="197" y="74" width="79" height="11" transform="rotate(-50,237,80)"/>
        <rect x="290" y="74" width="76" height="11" transform="rotate(50,328,80)"/>
        <!-- bottom row -->
        <rect x="14"  y="205" width="76" height="11" transform="rotate(-50,52,210)"/>
        <rect x="104" y="205" width="79" height="11" transform="rotate(50,143,210)"/>
        <rect x="197" y="205" width="79" height="11" transform="rotate(-50,237,210)"/>
        <rect x="290" y="205" width="76" height="11" transform="rotate(50,328,210)"/>
      </g>
    </g>
    <text class="key" x="190" y="300">materialKey="brick_red" + fachwerkPattern</text>
    <text class="key" x="190" y="316">diagonalsPerPanel="vee", midRail at 1.5 m</text>
  </g>

  <!-- ── Right facade: plaster infill (whitewashed Gefache) ────────────── -->
  <g transform="translate(480,80)">
    <rect x="0" y="0" width="380" height="280" fill="#efe9d8"/>
    <g fill="#3a2418">
      <rect x="0" y="260" width="380" height="20"/>
      <rect x="0" y="0" width="380" height="20"/>
      <rect x="0" y="135" width="380" height="14"/>
      <rect x="0"   y="20" width="14" height="115"/>
      <rect x="0"   y="149" width="14" height="111"/>
      <rect x="90"  y="20" width="14" height="115"/>
      <rect x="90"  y="149" width="14" height="111"/>
      <rect x="183" y="20" width="14" height="115"/>
      <rect x="183" y="149" width="14" height="111"/>
      <rect x="276" y="20" width="14" height="115"/>
      <rect x="276" y="149" width="14" height="111"/>
      <rect x="366" y="20" width="14" height="115"/>
      <rect x="366" y="149" width="14" height="111"/>
      <!-- Andreaskreuz: every bay gets both diagonals -->
      <g>
        <rect x="14"  y="74" width="76" height="11" transform="rotate(-50,52,80)"/>
        <rect x="14"  y="74" width="76" height="11" transform="rotate(50,52,80)"/>
        <rect x="104" y="74" width="79" height="11" transform="rotate(-50,143,80)"/>
        <rect x="104" y="74" width="79" height="11" transform="rotate(50,143,80)"/>
        <rect x="197" y="74" width="79" height="11" transform="rotate(-50,237,80)"/>
        <rect x="197" y="74" width="79" height="11" transform="rotate(50,237,80)"/>
        <rect x="290" y="74" width="76" height="11" transform="rotate(-50,328,80)"/>
        <rect x="290" y="74" width="76" height="11" transform="rotate(50,328,80)"/>
        <rect x="14"  y="205" width="76" height="11" transform="rotate(-50,52,210)"/>
        <rect x="14"  y="205" width="76" height="11" transform="rotate(50,52,210)"/>
        <rect x="104" y="205" width="79" height="11" transform="rotate(-50,143,210)"/>
        <rect x="104" y="205" width="79" height="11" transform="rotate(50,143,210)"/>
        <rect x="197" y="205" width="79" height="11" transform="rotate(-50,237,210)"/>
        <rect x="197" y="205" width="79" height="11" transform="rotate(50,237,210)"/>
        <rect x="290" y="205" width="76" height="11" transform="rotate(-50,328,210)"/>
        <rect x="290" y="205" width="76" height="11" transform="rotate(50,328,210)"/>
      </g>
    </g>
    <text class="key" x="190" y="300">materialKey="plaster" + fachwerkPattern</text>
    <text class="key" x="190" y="316">diagonalsPerPanel="andreas_kreuz"</text>
  </g>

  <text class="anno" x="40"  y="400">timber overlay material: timber_dark_oak (#3a2418)  •  draws ~10 mm proud of wall face  •  per-Ständer authoring deferred</text>
</svg>
