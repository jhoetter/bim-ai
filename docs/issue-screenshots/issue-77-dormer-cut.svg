<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Issue #77 — dormer CSG cut: before vs after (section view)</title>
  <desc>
    East-elevation section through a gable roof with a single shed dormer.
    Before: the CSG cutter starts at refElev (ground floor) with a 30m
    height, so the SUBTRACTION carves a vertical slot through both the
    roof AND the EG wall + storey below — the EG window behind the
    dormer is exposed through the resulting void. After: the cutter
    starts at eaveY - 0.05m (just under the wall plate) so the hole is
    confined to the roof volume; the EG storey behind the dormer stays
    opaque.
  </desc>

  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dbe7f3"/>
      <stop offset="1" stop-color="#f4f7fa"/>
    </linearGradient>
    <pattern id="tiles" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#b35d4f"/>
      <line x1="0" y1="0" x2="8" y2="0" stroke="#7d3d33" stroke-width="0.8"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#7d3d33" stroke-width="0.6"/>
    </pattern>
    <pattern id="bricks" width="14" height="8" patternUnits="userSpaceOnUse">
      <rect width="14" height="8" fill="#e7d7b0"/>
      <path d="M0 0 L14 0 M0 4 L14 4 M0 8 L14 8 M7 0 L7 4 M0 4 L0 8 M14 4 L14 8" stroke="#bda77b" stroke-width="0.5"/>
    </pattern>
    <pattern id="hatchVoid" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="6" x2="6" y2="0" stroke="#c0392b" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f3a5f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="520" fill="#ffffff"/>

  <!-- =================== BEFORE PANEL =================== -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="560" height="480" fill="url(#sky)" stroke="#cdd6df" stroke-width="1"/>

    <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#7d2a1f">
      Before — cut exposes EG window
    </text>
    <text x="280" y="48" text-anchor="middle" font-size="12" fill="#475569">
      cutter baseY = refElev (ground floor), height = 30 m
    </text>

    <!-- ground -->
    <line x1="40" y1="430" x2="520" y2="430" stroke="#6b7280" stroke-width="1.5"/>
    <text x="48" y="445" font-size="10" fill="#6b7280">±0.00 (refElev)</text>

    <!-- EG wall behind (back) -->
    <rect x="120" y="290" width="320" height="140" fill="url(#bricks)" stroke="#8a6f3d" stroke-width="1"/>
    <text x="135" y="305" font-size="10" fill="#5e4626">EG (storey below)</text>

    <!-- EG window (the leak) -->
    <rect x="265" y="335" width="60" height="50" fill="#cfe6f3" stroke="#3a647d" stroke-width="1.2"/>
    <line x1="295" y1="335" x2="295" y2="385" stroke="#3a647d" stroke-width="0.8"/>
    <line x1="265" y1="360" x2="325" y2="360" stroke="#3a647d" stroke-width="0.8"/>
    <text x="295" y="395" font-size="9" text-anchor="middle" fill="#3a647d">EG window</text>

    <!-- wall top line / eave -->
    <line x1="40" y1="290" x2="520" y2="290" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="0.8"/>
    <text x="48" y="285" font-size="10" fill="#475569">eaveY (top of wall)</text>

    <!-- roof, gable section: left slope, ridge, right slope -->
    <polygon points="100,290 280,180 460,290" fill="url(#tiles)" stroke="#5a2a23" stroke-width="1.2"/>

    <!-- DORMER CUT: drawn as a vertical hole that goes through BOTH roof
         AND the EG wall behind it -->
    <!-- Hole region (cut volume) — extends from groundish (refElev) up
         through the roof -->
    <rect x="240" y="220" width="80" height="210" fill="url(#hatchVoid)" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/>
    <!-- Roof-tile edges that have been chewed away -->
    <line x1="240" y1="220" x2="240" y2="430" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="320" y1="220" x2="320" y2="430" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>

    <!-- The leaking EG window is visible THROUGH the hole; redraw the
         window outline in red-dashed to show edge-line bleed-through -->
    <rect x="265" y="335" width="55" height="50" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 2"/>

    <!-- Shed dormer body in front of the hole -->
    <polygon points="240,255 320,235 320,290 240,290" fill="#c8714d" stroke="#5a2a23" stroke-width="1.2"/>
    <rect x="252" y="262" width="56" height="24" fill="#cfe6f3" stroke="#3a647d" stroke-width="1"/>

    <!-- Annotations -->
    <line x1="345" y1="260" x2="440" y2="220" stroke="#1f3a5f" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="445" y="218" font-size="10" fill="#1f3a5f">30 m tall cutter</text>
    <text x="445" y="232" font-size="10" fill="#1f3a5f">slices wall + roof</text>

    <line x1="360" y1="365" x2="430" y2="365" stroke="#c0392b" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="435" y="362" font-size="10" fill="#c0392b">EG window leak</text>
    <text x="435" y="374" font-size="10" fill="#c0392b">visible through hole</text>

    <!-- legend -->
    <g transform="translate(40, 455)">
      <rect width="14" height="10" fill="url(#hatchVoid)" stroke="#c0392b" stroke-width="0.8"/>
      <text x="20" y="9" font-size="10" fill="#374151">subtracted CSG volume (cut box)</text>
    </g>
  </g>

  <!-- =================== AFTER PANEL =================== -->
  <g transform="translate(600,20)">
    <rect x="0" y="0" width="560" height="480" fill="url(#sky)" stroke="#cdd6df" stroke-width="1"/>

    <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5c2f">
      After — cut limited to roof volume
    </text>
    <text x="280" y="48" text-anchor="middle" font-size="12" fill="#475569">
      cutter baseY = eaveY − 0.05 m, height = 30 m
    </text>

    <!-- ground -->
    <line x1="40" y1="430" x2="520" y2="430" stroke="#6b7280" stroke-width="1.5"/>
    <text x="48" y="445" font-size="10" fill="#6b7280">±0.00 (refElev)</text>

    <!-- EG wall behind — fully intact now -->
    <rect x="120" y="290" width="320" height="140" fill="url(#bricks)" stroke="#8a6f3d" stroke-width="1"/>
    <text x="135" y="305" font-size="10" fill="#5e4626">EG (storey below)</text>

    <!-- EG window stays HIDDEN behind opaque wall (drawn faint so the
         reader can confirm it is still in the model, just not visible
         through the dormer void) -->
    <rect x="265" y="335" width="60" height="50" fill="#cfe6f3" stroke="#3a647d" stroke-width="1.2"/>
    <line x1="295" y1="335" x2="295" y2="385" stroke="#3a647d" stroke-width="0.8"/>
    <line x1="265" y1="360" x2="325" y2="360" stroke="#3a647d" stroke-width="0.8"/>
    <text x="295" y="395" font-size="9" text-anchor="middle" fill="#3a647d">EG window (occluded)</text>

    <!-- wall top line / eave -->
    <line x1="40" y1="290" x2="520" y2="290" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="0.8"/>
    <text x="48" y="285" font-size="10" fill="#475569">eaveY (top of wall)</text>

    <!-- roof, with cut now ONLY in the roof slab -->
    <polygon points="100,290 280,180 460,290" fill="url(#tiles)" stroke="#5a2a23" stroke-width="1.2"/>

    <!-- Cut volume: limited to ABOVE the eaveY line (with 0.05m margin
         just under the eave to capture the bottom face) -->
    <rect x="240" y="220" width="80" height="73" fill="url(#hatchVoid)" stroke="#2f5c2f" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="240" y1="293" x2="320" y2="293" stroke="#2f5c2f" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="324" y="298" font-size="9" fill="#2f5c2f">cutter bottom face</text>

    <!-- Shed dormer body in front of the cut -->
    <polygon points="240,255 320,235 320,290 240,290" fill="#c8714d" stroke="#5a2a23" stroke-width="1.2"/>
    <rect x="252" y="262" width="56" height="24" fill="#cfe6f3" stroke="#3a647d" stroke-width="1"/>

    <!-- Annotations -->
    <line x1="345" y1="245" x2="440" y2="225" stroke="#1f3a5f" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="445" y="222" font-size="10" fill="#1f3a5f">cutter starts just below</text>
    <text x="445" y="234" font-size="10" fill="#1f3a5f">eaveY (margin 0.05 m)</text>

    <line x1="170" y1="320" x2="245" y2="345" stroke="#2f5c2f" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="60" y="324" font-size="10" fill="#2f5c2f">EG storey stays opaque</text>

    <!-- legend -->
    <g transform="translate(40, 455)">
      <rect width="14" height="10" fill="url(#hatchVoid)" stroke="#2f5c2f" stroke-width="0.8"/>
      <text x="20" y="9" font-size="10" fill="#374151">subtracted CSG volume (cut box)</text>
    </g>
  </g>
</svg>
