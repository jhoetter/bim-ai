<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Issue #103 — duplicate main gable roof emitted by shell + roof-main phases</title>
  <desc>
    Section view (south elevation, EG + DG only) of a testhouse main gable. Before:
    _shell_bundle_from_ir emits th-{house}-i{iter_n}-main-roof AND the dedicated
    roof-main phase emits th-{house}-main-roof. The ids do not collide, so both
    commit and the renderer draws two stacked gables at DG (terracotta tiles from
    the roof phase + flat-grey gable from the shell phase, z-fighting along ridge
    + eaves). After: shell phase is levels + slab + EG walls only; roof phase owns
    roof authoring, producing one clean gable.
  </desc>

  <defs>
    <linearGradient id="sky103" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dbe7f3"/>
      <stop offset="1" stop-color="#f4f7fa"/>
    </linearGradient>
    <pattern id="tileHatch" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#c0532d"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#7a2e15" stroke-width="0.6"/>
      <line x1="3" y1="0" x2="3" y2="6" stroke="#7a2e15" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow103" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="460" fill="#ffffff"/>

  <!-- ==================== LEFT PANEL: BEFORE ==================== -->
  <g id="before103">
    <rect x="20" y="20" width="520" height="420" fill="url(#sky103)" stroke="#c5cdd6" stroke-width="1"/>
    <text x="280" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Before — stacked gables</text>
    <text x="280" y="64" text-anchor="middle" font-size="11" fill="#4b5563">
      shell.createRoof + roof-main.createRoof both commit; renderer draws roofs=2
    </text>

    <!-- EG box -->
    <rect x="150" y="270" width="280" height="100" fill="#f1ece4" stroke="#1f2937" stroke-width="1.5"/>
    <text x="290" y="325" text-anchor="middle" font-size="11" fill="#1f2937">EG</text>

    <!-- Roof #1: from roof-main phase (terracotta tiles, pitch from IR) -->
    <polygon points="150,270 290,180 430,270" fill="url(#tileHatch)" stroke="#5a2510" stroke-width="1.5"/>
    <text x="290" y="240" text-anchor="middle" font-size="9" fill="#3a1808" font-weight="700">th-h-main-roof (roof-main phase)</text>

    <!-- Roof #2: from shell phase (flat grey, slope 35°, NO material) -->
    <polygon points="142,272 290,168 438,272" fill="#9aa0a6" fill-opacity="0.75" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="290" y="160" text-anchor="middle" font-size="9" fill="#1f2937" font-weight="700">th-h-i3-main-roof (shell phase)</text>

    <!-- z-fight callout -->
    <text x="290" y="395" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="700">2 createRoof commands → z-fight ridge + eaves</text>
    <path d="M 290 380 L 290 280" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#arrow103)"/>

    <text x="40" y="420" font-size="9" fill="#6b7280">CLAUDE.md: "Element-count roofs=2 is always a bug"</text>
  </g>

  <!-- ==================== RIGHT PANEL: AFTER ==================== -->
  <g id="after103">
    <rect x="560" y="20" width="520" height="420" fill="url(#sky103)" stroke="#c5cdd6" stroke-width="1"/>
    <text x="820" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">After — single clean gable</text>
    <text x="820" y="64" text-anchor="middle" font-size="11" fill="#4b5563">
      shell = levels + slab + EG walls only; _roof_bundle owns roof authoring
    </text>

    <rect x="690" y="270" width="280" height="100" fill="#f1ece4" stroke="#1f2937" stroke-width="1.5"/>
    <text x="830" y="325" text-anchor="middle" font-size="11" fill="#1f2937">EG</text>

    <polygon points="690,270 830,180 970,270" fill="url(#tileHatch)" stroke="#5a2510" stroke-width="1.5"/>
    <text x="830" y="240" text-anchor="middle" font-size="9" fill="#3a1808" font-weight="700">th-h-main-roof (roof-main phase only)</text>

    <text x="830" y="395" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="700">1 createRoof → roofs=1, ridge clean</text>
  </g>
</svg>
