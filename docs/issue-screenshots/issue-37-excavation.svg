<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Issue #37 — toposolid_excavation around below-grade levels, before vs after</title>
  <desc>
    Section view (south elevation) of a 2-storey-plus-Keller house. Grade is at z=0
    and the KG floor sits at z=-2700. Before: the topo slab is flat across the
    site, so the KG walls + windows hang in open air below the slab — geometrically
    nonsensical. After: a CreateToposolidExcavation cmd (TOP-V3-05) carves an
    earth volume the building extent + 500mm collar wide, depth = abs(KG elevation)
    + 500mm, so the basement sits inside the cut and the toposolid surface only
    breaks where the cut meets daylight.
  </desc>

  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dbe7f3"/>
      <stop offset="1" stop-color="#f4f7fa"/>
    </linearGradient>
    <pattern id="soilHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#a0805a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1100" height="460" fill="#ffffff"/>

  <!-- ==================== LEFT PANEL: BEFORE ==================== -->
  <g id="before">
    <rect x="20" y="20" width="520" height="420" fill="url(#sky)" stroke="#c5cdd6" stroke-width="1"/>
    <text x="280" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Before</text>
    <text x="280" y="64" text-anchor="middle" font-size="11" fill="#4b5563">
      _topology_bundle emits no excavation; KG hangs below the topo slab
    </text>

    <!-- grade line label -->
    <text x="40" y="220" font-size="10" fill="#6b7280">z = 0 (grade)</text>

    <!-- Toposolid: flat slab spanning the full panel below grade -->
    <rect x="40" y="225" width="480" height="55" fill="url(#soilHatch)" stroke="#7a5a3a" stroke-width="1"/>
    <text x="280" y="262" text-anchor="middle" font-size="10" fill="#4b3a25">toposolid (1500 mm thick, base z=0)</text>

    <!-- EG building above grade -->
    <rect x="170" y="125" width="220" height="100" fill="#f1ece4" stroke="#1f2937" stroke-width="1.5"/>
    <text x="280" y="180" text-anchor="middle" font-size="11" fill="#1f2937">EG</text>
    <!-- EG window -->
    <rect x="200" y="160" width="35" height="35" fill="#dde9f3" stroke="#1f2937"/>
    <rect x="325" y="160" width="35" height="35" fill="#dde9f3" stroke="#1f2937"/>

    <!-- KG walls dropping THROUGH the toposolid and hanging in open air below it -->
    <rect x="170" y="225" width="6" height="120" fill="#1f2937"/>
    <rect x="384" y="225" width="6" height="120" fill="#1f2937"/>
    <line x1="170" y1="345" x2="390" y2="345" stroke="#1f2937" stroke-width="2"/>

    <!-- KG window: visibly floating in mid-air below the soil layer -->
    <rect x="240" y="295" width="50" height="30" fill="#fcdcdc" stroke="#b91c1c" stroke-width="2"/>
    <text x="265" y="316" text-anchor="middle" font-size="9" fill="#7f1d1d" font-weight="700">KG window</text>

    <!-- Annotation arrows -->
    <text x="265" y="365" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="700">KG floats below the topo slab</text>
    <path d="M 265 350 L 265 340" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

    <!-- z markers -->
    <line x1="510" y1="225" x2="515" y2="225" stroke="#6b7280"/>
    <text x="500" y="228" text-anchor="end" font-size="9" fill="#6b7280">0</text>
    <line x1="510" y1="345" x2="515" y2="345" stroke="#6b7280"/>
    <text x="500" y="348" text-anchor="end" font-size="9" fill="#6b7280">-2700</text>
  </g>

  <!-- ==================== RIGHT PANEL: AFTER ==================== -->
  <g id="after">
    <rect x="560" y="20" width="520" height="420" fill="url(#sky)" stroke="#c5cdd6" stroke-width="1"/>
    <text x="820" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">After</text>
    <text x="820" y="64" text-anchor="middle" font-size="11" fill="#4b5563">
      CreateToposolidExcavation: cutter = building extent + 500mm; depth = abs(z) + 500
    </text>

    <text x="580" y="220" font-size="10" fill="#6b7280">z = 0 (grade)</text>

    <!-- Toposolid soil, but cut out around the KG envelope -->
    <path d="M 580 225 L 690 225 L 690 350 L 920 350 L 920 225 L 1060 225 L 1060 280 L 580 280 Z"
          fill="url(#soilHatch)" stroke="#7a5a3a" stroke-width="1"/>
    <text x="635" y="262" text-anchor="middle" font-size="10" fill="#4b3a25">topo</text>
    <text x="990" y="262" text-anchor="middle" font-size="10" fill="#4b3a25">topo</text>

    <!-- Excavation void (drawn lighter to suggest open earth-pit) -->
    <rect x="690" y="225" width="230" height="125" fill="#fef9e7" stroke="#a16207" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="805" y="245" text-anchor="middle" font-size="9" fill="#a16207">excavation (cutter floor on level-KG)</text>

    <!-- EG building above grade (same as before) -->
    <rect x="710" y="125" width="220" height="100" fill="#f1ece4" stroke="#1f2937" stroke-width="1.5"/>
    <text x="820" y="180" text-anchor="middle" font-size="11" fill="#1f2937">EG</text>
    <rect x="740" y="160" width="35" height="35" fill="#dde9f3" stroke="#1f2937"/>
    <rect x="865" y="160" width="35" height="35" fill="#dde9f3" stroke="#1f2937"/>

    <!-- KG walls + window now sit INSIDE the excavation void, hidden from outside -->
    <rect x="710" y="225" width="6" height="120" fill="#1f2937"/>
    <rect x="924" y="225" width="6" height="120" fill="#1f2937"/>
    <line x1="710" y1="345" x2="930" y2="345" stroke="#1f2937" stroke-width="2"/>
    <rect x="780" y="295" width="50" height="30" fill="#dde9f3" stroke="#1f2937"/>
    <text x="805" y="316" text-anchor="middle" font-size="9" fill="#1f2937">KG</text>

    <!-- Annotation -->
    <text x="805" y="385" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="700">KG enclosed by excavation</text>

    <!-- z markers -->
    <line x1="1060" y1="225" x2="1065" y2="225" stroke="#6b7280"/>
    <text x="1075" y="228" font-size="9" fill="#6b7280">0</text>
    <line x1="1060" y1="345" x2="1065" y2="345" stroke="#6b7280"/>
    <text x="1075" y="348" font-size="9" fill="#6b7280">-3200</text>
    <text x="1075" y="360" font-size="8" fill="#6b7280">(=-2700-500)</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
  </defs>
</svg>
