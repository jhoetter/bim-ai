<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Issue #105 — half_gable (Krüppelwalmdach) RoofGeometryMode, gable-end view</title>
  <desc>
    Gable-end view of an 8000 x 5000 mm rectangular footprint. Before: the only
    rectangle-pitched literal is gable_pitched_rectangle, so the gable end is a
    full triangle (apex at the ridge). After: roofGeometryMode = half_gable
    truncates the top fraction (halfHipHeightFraction = 0.33 by default) of the
    gable triangle and replaces it with a small hip cap that slopes back to the
    (shortened) ridge — matching a Krüppelwalmdach.
  </desc>

  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dbe7f3"/>
      <stop offset="1" stop-color="#f4f7fa"/>
    </linearGradient>
    <pattern id="roofTilesGable" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#b35d4f"/>
      <line x1="0" y1="0" x2="8" y2="0" stroke="#7d3d33" stroke-width="0.8"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#7d3d33" stroke-width="0.6"/>
    </pattern>
    <pattern id="roofTilesHalfGable" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#9b5141"/>
      <line x1="0" y1="0" x2="8" y2="0" stroke="#5e2f24" stroke-width="0.8"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#5e2f24" stroke-width="0.6"/>
    </pattern>
    <pattern id="hipCap" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#6b8f5d"/>
      <line x1="0" y1="0" x2="6" y2="6" stroke="#3d5a35" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1100" height="460" fill="#ffffff"/>

  <!-- ==================== LEFT PANEL: BEFORE (full gable) ==================== -->
  <g id="before">
    <rect x="20" y="20" width="520" height="420" fill="url(#sky)" stroke="#c5cdd6" stroke-width="1"/>
    <text x="280" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Full gable triangle (existing)</text>
    <text x="280" y="64" text-anchor="middle" font-size="11" fill="#4b5563">
      roofGeometryMode: "gable_pitched_rectangle" — gable end is a full triangle
    </text>

    <line x1="40" y1="380" x2="520" y2="380" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Walls: 5m wide x 3m tall, scale 50 px/m. Wall span 5m → 250 px.
         Footprint left x=155, right x=405; eave at y=230 (top of wall). -->
    <rect x="155" y="230" width="250" height="150" fill="#f4ead8" stroke="#5b4633" stroke-width="1.5"/>

    <!-- Full gable triangle. half_span = 2.5 m, slope = 35° → rise ≈ 1.75 m → 87 px.
         Ridge at x=280 (centre), y=143. -->
    <polygon points="155,230 405,230 280,143" fill="url(#roofTilesGable)" stroke="#7d3d33" stroke-width="1.5"/>

    <!-- Ridge marker -->
    <circle cx="280" cy="143" r="3" fill="#ffffff" stroke="#7d3d33" stroke-width="1.5"/>
    <text x="280" y="137" text-anchor="middle" font-size="10" fill="#7d3d33" font-weight="600">ridge</text>

    <!-- Eave labels -->
    <text x="150" y="245" text-anchor="end" font-size="9" fill="#4b5563">eave</text>
    <text x="410" y="245" text-anchor="start" font-size="9" fill="#4b5563">eave</text>

    <!-- Annotation: closest existing literal -->
    <g transform="translate(40, 405)">
      <text font-size="10" fill="#991b1b" font-weight="600">x</text>
      <text x="14" font-size="10" fill="#4b5563">
        Source Krüppelwalm has a hip cap at the top — full gable triangle is wrong.
      </text>
    </g>

    <!-- Issue badge -->
    <g transform="translate(40, 90)">
      <rect width="155" height="22" rx="11" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="78" y="15" text-anchor="middle" font-size="10" fill="#7f1d1d" font-weight="600">renderer mismatch</text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: AFTER (truncated gable + hip cap) ==================== -->
  <g id="after">
    <rect x="560" y="20" width="520" height="420" fill="url(#sky)" stroke="#c5cdd6" stroke-width="1"/>
    <text x="820" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Truncated gable + hip cap (new)</text>
    <text x="820" y="64" text-anchor="middle" font-size="11" fill="#4b5563">
      roofGeometryMode: "half_gable", halfHipHeightFraction: 0.33 — hip covers top third
    </text>

    <line x1="580" y1="380" x2="1060" y2="380" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Walls -->
    <rect x="695" y="230" width="250" height="150" fill="#f4ead8" stroke="#5b4633" stroke-width="1.5"/>

    <!-- Truncated gable end (trapezoid). Truncation at top third:
         full rise ≈ 87 px → truncation Y = 230 - 87*(1-0.33) ≈ 230 - 58 = 172.
         Lateral inset = half_span * 0.33 = 2.5 * 0.33 ≈ 0.825 m → 41 px.
         Trapezoid base x ∈ [695, 945], top x ∈ [695+41, 945-41] = [736, 904]. -->
    <polygon points="695,230 945,230 904,172 736,172" fill="url(#roofTilesHalfGable)" stroke="#5e2f24" stroke-width="1.5"/>

    <!-- Hip cap: triangle from the two truncation points up to the ridge.
         Ridge centre at x = 820, y = 143 (same height as the full gable). -->
    <polygon points="736,172 904,172 820,143" fill="url(#hipCap)" stroke="#3d5a35" stroke-width="1.5"/>

    <!-- Ridge marker -->
    <circle cx="820" cy="143" r="3" fill="#ffffff" stroke="#3d5a35" stroke-width="1.5"/>
    <text x="820" y="137" text-anchor="middle" font-size="10" fill="#3d5a35" font-weight="600">ridge</text>

    <!-- Truncation height annotation -->
    <line x1="685" y1="143" x2="685" y2="172" stroke="#3d5a35" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="681" y1="143" x2="689" y2="143" stroke="#3d5a35" stroke-width="1"/>
    <line x1="681" y1="172" x2="689" y2="172" stroke="#3d5a35" stroke-width="1"/>
    <text x="680" y="161" text-anchor="end" font-size="9" fill="#3d5a35">hip cap (top 33%)</text>

    <!-- Gable trapezoid annotation -->
    <line x1="685" y1="172" x2="685" y2="230" stroke="#5e2f24" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="681" y1="230" x2="689" y2="230" stroke="#5e2f24" stroke-width="1"/>
    <text x="680" y="205" text-anchor="end" font-size="9" fill="#5e2f24">truncated gable</text>

    <!-- Eave labels -->
    <text x="690" y="245" text-anchor="end" font-size="9" fill="#4b5563">eave</text>
    <text x="950" y="245" text-anchor="start" font-size="9" fill="#4b5563">eave</text>

    <!-- Truncation point markers -->
    <circle cx="736" cy="172" r="2" fill="#5e2f24"/>
    <circle cx="904" cy="172" r="2" fill="#5e2f24"/>

    <!-- Annotation -->
    <g transform="translate(580, 405)">
      <text font-size="10" fill="#15803d" font-weight="600">✓</text>
      <text x="14" font-size="10" fill="#4b5563">
        Gable triangle clipped at ridge·(1−f); hip cap slopes back to ridge.
        IFC PredefinedType = HIPPED_GABLE_ROOF (IFC4 enumerated literal).
      </text>
    </g>

    <!-- Mode badge -->
    <g transform="translate(580, 90)">
      <rect width="180" height="22" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="90" y="15" text-anchor="middle" font-size="10" fill="#14532d" font-weight="600">RoofGeometryMode: half_gable</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="550" y="455" text-anchor="middle" font-size="9.5" fill="#6b7280">
    Issue #105 — closes Krüppelwalmdach gap. fraction=0 → pure gable, fraction=1 → functional hip.
  </text>
</svg>
