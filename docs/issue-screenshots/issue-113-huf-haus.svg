<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Issue #113 — Huf-Haus Pfosten-Riegel-Strukturfassade with Diagonalstreben</title>
  <desc>
    Front elevation of a Huf-Haus south facade. Before: a single opaque
    stucco wall, no facade-structure mechanism. After: a new
    `structural_facade_grid` element renders a dark timber lattice (posts +
    beams + diagonal struts) on a fully glazed shell — the signature
    Huf-Haus look. The grid sits ~30mm proud of the wall face and frames
    rectangular glass bays.
  </desc>

  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dbe7f3"/>
      <stop offset="1" stop-color="#f4f7fa"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#cfe1ec" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a8c4d6" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="render" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#e9e5dc"/>
      <circle cx="2" cy="2" r="0.6" fill="#cfc8b7"/>
      <circle cx="4" cy="4" r="0.6" fill="#cfc8b7"/>
    </pattern>
  </defs>

  <rect width="1100" height="480" fill="url(#sky)"/>

  <!-- ── Header ──────────────────────────────────────────────────── -->
  <text x="40" y="32" font-size="18" font-weight="700" fill="#1f2937">
    Issue #113 — Huf-Haus Pfosten-Riegel-Strukturfassade
  </text>
  <text x="40" y="54" font-size="13" fill="#475569">
    A new structural_facade_grid element renders a dark timber lattice on a glazed shell.
  </text>

  <!-- ── BEFORE: opaque stucco wall (left panel) ─────────────────── -->
  <g transform="translate(40, 90)">
    <text x="0" y="-10" font-size="13" font-weight="600" fill="#334155">Before</text>
    <text x="0" y="6" font-size="11" fill="#64748b">Single opaque wall material — no facade-structure mechanism</text>

    <!-- ground line -->
    <line x1="0" y1="340" x2="460" y2="340" stroke="#64748b" stroke-width="1"/>

    <!-- wall -->
    <rect x="20" y="20" width="420" height="320" fill="url(#render)" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- caption -->
    <text x="230" y="180" font-size="13" fill="#475569" text-anchor="middle">stucco / render</text>
    <text x="230" y="200" font-size="11" fill="#94a3b8" text-anchor="middle">(no grid, no struts)</text>
  </g>

  <!-- ── AFTER: Pfosten-Riegel grid + glass infill (right panel) ─── -->
  <g transform="translate(580, 90)">
    <text x="0" y="-10" font-size="13" font-weight="600" fill="#334155">After</text>
    <text x="0" y="6" font-size="11" fill="#64748b">Posts + beams + diagonals, glass infill — the Huf-Haus signature</text>

    <!-- ground line -->
    <line x1="0" y1="340" x2="460" y2="340" stroke="#64748b" stroke-width="1"/>

    <!-- glass infill (full facade) -->
    <rect x="20" y="20" width="420" height="320" fill="url(#glass)" stroke="#94a3b8" stroke-width="0.5"/>

    <!-- horizontal beams (Riegel) at y = 20, 180, 340 -->
    <rect x="20" y="20" width="420" height="10" fill="#2c1d11"/>
    <rect x="20" y="180" width="420" height="10" fill="#2c1d11"/>
    <rect x="20" y="330" width="420" height="10" fill="#2c1d11"/>

    <!-- vertical posts (Pfosten) at x = 20, 125, 230, 335, 440 -->
    <rect x="20" y="20" width="10" height="320" fill="#2c1d11"/>
    <rect x="115" y="20" width="10" height="320" fill="#2c1d11"/>
    <rect x="220" y="20" width="10" height="320" fill="#2c1d11"/>
    <rect x="325" y="20" width="10" height="320" fill="#2c1d11"/>
    <rect x="430" y="20" width="10" height="320" fill="#2c1d11"/>

    <!-- diagonal struts (Streben) — one per bay, low-left → high-right -->
    <g stroke="#2c1d11" stroke-width="8" stroke-linecap="round">
      <!-- row 1 (top half) -->
      <line x1="30" y1="180" x2="115" y2="30"/>
      <line x1="125" y1="180" x2="220" y2="30"/>
      <line x1="230" y1="180" x2="325" y2="30"/>
      <line x1="335" y1="180" x2="430" y2="30"/>
      <!-- row 2 (bottom half) -->
      <line x1="30" y1="330" x2="115" y2="190"/>
      <line x1="125" y1="330" x2="220" y2="190"/>
      <line x1="230" y1="330" x2="325" y2="190"/>
      <line x1="335" y1="330" x2="430" y2="190"/>
    </g>

    <!-- annotation arrows -->
    <g font-size="11" fill="#475569">
      <text x="50" y="365">post (Pfosten)</text>
      <line x1="80" y1="358" x2="125" y2="335" stroke="#475569" stroke-width="0.8" marker-end="url(#arrow)"/>

      <text x="170" y="365">beam (Riegel)</text>
      <line x1="195" y1="358" x2="220" y2="335" stroke="#475569" stroke-width="0.8"/>

      <text x="290" y="365">diagonal (Strebe)</text>
      <line x1="325" y1="358" x2="335" y2="335" stroke="#475569" stroke-width="0.8"/>
    </g>
  </g>

  <!-- ── Element kind footer ─────────────────────────────────────── -->
  <g transform="translate(40, 445)">
    <text x="0" y="0" font-size="11" fill="#475569">
      Element kind: <tspan font-family="ui-monospace, monospace" fill="#1e293b">structural_facade_grid</tspan>
      · fields: postSpacingMm, beamHeights[], diagonalStrutPattern ('none' | 'single' | 'cross'),
      memberThicknessMm (~80mm), proudOffsetMm (~30mm), timberMaterialKey ('dark_oak'), infillMaterialKey ('glass_clear').
    </text>
  </g>
</svg>
