<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Issue #14 — toposolid heightSamples rendering, before vs after</title>
  <desc>
    Section view (east elevation) of testhouse-2 hillside toposolid (boundary ~20m wide,
    44 heightSamples spanning a 4900mm E–W drop). Before: top surface stays flat between
    boundary corners. After: interior grid tessellation propagates heightSamples and the
    3–4m drop is clearly visible.
  </desc>

  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dbe7f3"/>
      <stop offset="1" stop-color="#f4f7fa"/>
    </linearGradient>
    <pattern id="soilHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#a0805a" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Outer frame -->
  <rect x="0" y="0" width="1100" height="460" fill="#ffffff"/>

  <!-- ==================== LEFT PANEL: BEFORE ==================== -->
  <g id="before">
    <rect x="20" y="20" width="520" height="420" fill="url(#sky)" stroke="#c5cdd6" stroke-width="1"/>
    <text x="280" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Before</text>
    <text x="280" y="64" text-anchor="middle" font-size="11" fill="#4b5563">
      makeToposolidMesh only places vertices at boundary corners
    </text>
    <text x="280" y="78" text-anchor="middle" font-size="11" fill="#4b5563">
      → 44 heightSamples are ignored visually, slab renders flat
    </text>

    <!-- Ground reference line -->
    <line x1="50" y1="380" x2="510" y2="380" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="46" y="384" text-anchor="end" font-size="10" fill="#64748b">±0.0 m</text>

    <!-- Flat toposolid slab -->
    <rect x="80" y="280" width="400" height="60" fill="#cbb38a" stroke="#8b6f3a" stroke-width="1.5"/>
    <line x1="80" y1="280" x2="480" y2="280" stroke="#5e4a25" stroke-width="2"/>

    <!-- Underside hatch -->
    <rect x="80" y="280" width="400" height="60" fill="url(#soilHatch)" opacity="0.18"/>

    <!-- 4 boundary-corner vertices (nearest-neighbour resolved to ~similar Z) -->
    <circle cx="80" cy="280" r="4" fill="#ef4444"/>
    <circle cx="480" cy="280" r="4" fill="#ef4444"/>
    <circle cx="80" cy="340" r="3" fill="#7f1d1d"/>
    <circle cx="480" cy="340" r="3" fill="#7f1d1d"/>

    <!-- Sample markers showing what's *available* but unused -->
    <g opacity="0.65">
      <circle cx="120" cy="220" r="3" fill="#0ea5e9"/>
      <circle cx="160" cy="230" r="3" fill="#0ea5e9"/>
      <circle cx="200" cy="245" r="3" fill="#0ea5e9"/>
      <circle cx="240" cy="265" r="3" fill="#0ea5e9"/>
      <circle cx="280" cy="285" r="3" fill="#0ea5e9"/>
      <circle cx="320" cy="305" r="3" fill="#0ea5e9"/>
      <circle cx="360" cy="325" r="3" fill="#0ea5e9"/>
      <circle cx="400" cy="345" r="3" fill="#0ea5e9"/>
      <circle cx="440" cy="365" r="3" fill="#0ea5e9"/>
    </g>
    <text x="120" y="208" font-size="10" fill="#0369a1">heightSamples (dropped)</text>

    <!-- Drop annotation -->
    <line x1="60" y1="280" x2="60" y2="280" stroke="#dc2626" stroke-width="1"/>
    <text x="280" y="412" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="600">
      vertical span of top surface ≈ 0 m  (hillside invisible)
    </text>
  </g>

  <!-- ==================== RIGHT PANEL: AFTER ==================== -->
  <g id="after" transform="translate(540 0)">
    <rect x="20" y="20" width="520" height="420" fill="url(#sky)" stroke="#c5cdd6" stroke-width="1"/>
    <text x="280" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">After</text>
    <text x="280" y="64" text-anchor="middle" font-size="11" fill="#4b5563">
      Interior grid tessellation + IDW interpolation over heightSamples
    </text>
    <text x="280" y="78" text-anchor="middle" font-size="11" fill="#4b5563">
      → 3–4 m E→W drop is clearly visible (matches issue acceptance)
    </text>

    <!-- Ground reference line -->
    <line x1="50" y1="380" x2="510" y2="380" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="46" y="384" text-anchor="end" font-size="10" fill="#64748b">±0.0 m</text>

    <!-- Sloped toposolid top surface (24 segments) -->
    <polygon points="80,220 120,228 160,238 200,250 240,265 280,280 320,295 360,310 400,325 440,340 480,348 480,388 80,388"
             fill="#cbb38a" stroke="#8b6f3a" stroke-width="1.5"/>
    <polygon points="80,220 120,228 160,238 200,250 240,265 280,280 320,295 360,310 400,325 440,340 480,348 480,388 80,388"
             fill="url(#soilHatch)" opacity="0.18"/>

    <!-- Triangulation hint lines -->
    <g stroke="#7c5818" stroke-width="0.5" opacity="0.5">
      <line x1="120" y1="228" x2="120" y2="388"/>
      <line x1="160" y1="238" x2="160" y2="388"/>
      <line x1="200" y1="250" x2="200" y2="388"/>
      <line x1="240" y1="265" x2="240" y2="388"/>
      <line x1="280" y1="280" x2="280" y2="388"/>
      <line x1="320" y1="295" x2="320" y2="388"/>
      <line x1="360" y1="310" x2="360" y2="388"/>
      <line x1="400" y1="325" x2="400" y2="388"/>
      <line x1="440" y1="340" x2="440" y2="388"/>
    </g>

    <!-- Interior grid vertices -->
    <g fill="#22c55e">
      <circle cx="120" cy="228" r="3"/>
      <circle cx="160" cy="238" r="3"/>
      <circle cx="200" cy="250" r="3"/>
      <circle cx="240" cy="265" r="3"/>
      <circle cx="280" cy="280" r="3"/>
      <circle cx="320" cy="295" r="3"/>
      <circle cx="360" cy="310" r="3"/>
      <circle cx="400" cy="325" r="3"/>
      <circle cx="440" cy="340" r="3"/>
    </g>
    <text x="160" y="218" font-size="10" fill="#15803d">interior grid (Z from heightSamples)</text>

    <!-- Boundary corner markers -->
    <circle cx="80" cy="220" r="4" fill="#ef4444"/>
    <circle cx="480" cy="348" r="4" fill="#ef4444"/>

    <!-- Drop annotation -->
    <line x1="500" y1="220" x2="500" y2="348" stroke="#dc2626" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="500" y="290" text-anchor="start" font-size="11" fill="#dc2626" font-weight="600" transform="rotate(-90 500 290)">≈ 3.2 m drop</text>
    <text x="280" y="412" text-anchor="middle" font-size="12" fill="#15803d" font-weight="600">
      vertical span of top surface &gt; 3 m  (asserted by unit test)
    </text>
  </g>

  <!-- Footer note -->
  <text x="550" y="452" text-anchor="middle" font-size="10" fill="#64748b">
    Issue #14 — packages/web/src/viewport/meshBuilders.ts :: makeToposolidMesh
  </text>
</svg>
