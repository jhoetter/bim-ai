<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Issue #59 — REGRESSION: PR #58 (true ortho) broke E/S/N captures
       Schematic showing the SSAOPass perspective/orthographic depth mismatch
       that caused the opaque-black-silhouette artefact, and the fix. -->

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#0f172a"/>
  <text x="20" y="38" fill="#f8fafc" font-size="22" font-weight="700">
    Issue #59 — REGRESSION: PR #58 (true orthographic) broke E/S/N captures
  </text>
  <text x="20" y="56" fill="#94a3b8" font-size="12">
    SSAOPass shader define ``PERSPECTIVE_CAMERA`` was pinned at 1; with the ortho camera the depth probe collapsed and the copy pass multiplied the scene by ~0 → black silhouette
  </text>

  <!-- LEFT panel: BEFORE -->
  <rect x="20" y="80" width="560" height="600" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" rx="8"/>
  <text x="300" y="108" text-anchor="middle" fill="#991b1b" font-size="18" font-weight="700">
    BEFORE — iter-13 capture (3/4 directions black)
  </text>

  <!-- 4-up grid: W (works), E/S/N (black silhouette) -->
  <g transform="translate(40, 130)">
    <!-- WEST panel — proper render -->
    <rect x="0" y="0" width="250" height="200" fill="#dbeafe" stroke="#94a3b8"/>
    <text x="125" y="20" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="700">WEST — renders correctly</text>
    <!-- Mock building shape -->
    <polygon points="80,150 80,90 125,55 170,90 170,150" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <rect x="100" y="105" width="15" height="20" fill="#475569"/>
    <rect x="135" y="105" width="15" height="20" fill="#475569"/>
    <rect x="100" y="130" width="15" height="15" fill="#fbbf24"/>
    <rect x="135" y="130" width="15" height="15" fill="#fbbf24"/>
    <rect x="50" y="150" width="150" height="35" fill="#cbd5e1"/>
    <text x="125" y="178" text-anchor="middle" fill="#16a34a" font-size="10">SSAO incidentally OK</text>

    <!-- EAST panel — black silhouette -->
    <rect x="260" y="0" width="250" height="200" fill="#dbeafe" stroke="#94a3b8"/>
    <text x="385" y="20" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="700">EAST — opaque black silhouette</text>
    <polygon points="320,170 320,80 385,40 450,80 450,170" fill="#000000"/>
    <rect x="295" y="170" width="180" height="30" fill="#cbd5e1"/>
    <text x="385" y="195" text-anchor="middle" fill="#fef2f2" font-size="10" font-weight="700">SSAO × scene = 0</text>
  </g>

  <g transform="translate(40, 350)">
    <!-- SOUTH panel — black silhouette -->
    <rect x="0" y="0" width="250" height="200" fill="#dbeafe" stroke="#94a3b8"/>
    <text x="125" y="20" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="700">SOUTH — opaque black silhouette</text>
    <polygon points="60,170 60,85 125,50 190,85 190,170" fill="#000000"/>
    <rect x="35" y="170" width="180" height="30" fill="#cbd5e1"/>

    <!-- NORTH panel — black silhouette -->
    <rect x="260" y="0" width="250" height="200" fill="#dbeafe" stroke="#94a3b8"/>
    <text x="385" y="20" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="700">NORTH — opaque black silhouette</text>
    <polygon points="320,170 320,85 385,50 450,85 450,170" fill="#000000"/>
    <rect x="295" y="170" width="180" height="30" fill="#cbd5e1"/>
  </g>

  <!-- BEFORE caption -->
  <text x="40" y="585" fill="#1e293b" font-size="12" font-weight="700">Cause:</text>
  <text x="40" y="603" fill="#475569" font-size="11">SSAOPass.ssaoMaterial.defines.PERSPECTIVE_CAMERA stays at 1 when</text>
  <text x="40" y="618" fill="#475569" font-size="11">ssao.camera = orthoCamera. perspectiveDepthToViewZ() collapses for</text>
  <text x="40" y="633" fill="#475569" font-size="11">orthographic depth → SSAO factor ≈ 1 everywhere → copy pass</text>
  <text x="40" y="648" fill="#475569" font-size="11">(blendSrc: DstColorFactor, blendDst: ZeroFactor) multiplies by ~0.</text>
  <text x="40" y="666" fill="#dc2626" font-size="11" font-weight="700">Grade impact: -2.15 / -1.35 / -1.70 (house-21 / house-22 / house-23)</text>

  <!-- RIGHT panel: AFTER -->
  <rect x="620" y="80" width="560" height="600" fill="#f0fdf4" stroke="#86efac" stroke-width="2" rx="8"/>
  <text x="900" y="108" text-anchor="middle" fill="#166534" font-size="18" font-weight="700">
    AFTER — all 4 directions render properly
  </text>

  <g transform="translate(640, 130)">
    <!-- WEST -->
    <rect x="0" y="0" width="250" height="200" fill="#dbeafe" stroke="#94a3b8"/>
    <text x="125" y="20" text-anchor="middle" fill="#166534" font-size="12" font-weight="700">WEST</text>
    <polygon points="80,150 80,90 125,55 170,90 170,150" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <rect x="100" y="105" width="15" height="20" fill="#475569"/>
    <rect x="135" y="105" width="15" height="20" fill="#475569"/>
    <rect x="100" y="130" width="15" height="15" fill="#fbbf24"/>
    <rect x="135" y="130" width="15" height="15" fill="#fbbf24"/>
    <rect x="50" y="150" width="150" height="35" fill="#cbd5e1"/>

    <!-- EAST -->
    <rect x="260" y="0" width="250" height="200" fill="#dbeafe" stroke="#94a3b8"/>
    <text x="385" y="20" text-anchor="middle" fill="#166534" font-size="12" font-weight="700">EAST</text>
    <polygon points="340,150 340,90 385,55 430,90 430,150" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <rect x="360" y="105" width="15" height="20" fill="#475569"/>
    <rect x="395" y="105" width="15" height="20" fill="#475569"/>
    <rect x="360" y="130" width="15" height="15" fill="#fbbf24"/>
    <rect x="395" y="130" width="15" height="15" fill="#fbbf24"/>
    <rect x="310" y="150" width="150" height="35" fill="#cbd5e1"/>
  </g>

  <g transform="translate(640, 350)">
    <!-- SOUTH -->
    <rect x="0" y="0" width="250" height="200" fill="#dbeafe" stroke="#94a3b8"/>
    <text x="125" y="20" text-anchor="middle" fill="#166534" font-size="12" font-weight="700">SOUTH</text>
    <polygon points="80,150 80,90 125,55 170,90 170,150" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <rect x="100" y="105" width="15" height="20" fill="#475569"/>
    <rect x="135" y="105" width="15" height="20" fill="#475569"/>
    <rect x="100" y="130" width="15" height="15" fill="#fbbf24"/>
    <rect x="135" y="130" width="15" height="15" fill="#fbbf24"/>
    <rect x="50" y="150" width="150" height="35" fill="#cbd5e1"/>

    <!-- NORTH -->
    <rect x="260" y="0" width="250" height="200" fill="#dbeafe" stroke="#94a3b8"/>
    <text x="385" y="20" text-anchor="middle" fill="#166534" font-size="12" font-weight="700">NORTH</text>
    <polygon points="340,150 340,90 385,55 430,90 430,150" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <rect x="360" y="105" width="15" height="20" fill="#475569"/>
    <rect x="395" y="105" width="15" height="20" fill="#475569"/>
    <rect x="360" y="130" width="15" height="15" fill="#fbbf24"/>
    <rect x="395" y="130" width="15" height="15" fill="#fbbf24"/>
    <rect x="310" y="150" width="150" height="35" fill="#cbd5e1"/>
  </g>

  <!-- AFTER caption -->
  <text x="640" y="585" fill="#1e293b" font-size="12" font-weight="700">Fix:</text>
  <text x="640" y="603" fill="#475569" font-size="11">syncSsaoCameraDefines() now flips ssaoMaterial.defines.PERSPECTIVE_CAMERA</text>
  <text x="640" y="618" fill="#475569" font-size="11">to match the active camera (0 for OrthographicCamera, 1 for</text>
  <text x="640" y="633" fill="#475569" font-size="11">PerspectiveCamera) + republishes cameraNear / cameraFar /</text>
  <text x="640" y="648" fill="#475569" font-size="11">cameraProjectionMatrix every time the orthoMode toggle fires or a new</text>
  <text x="640" y="663" fill="#16a34a" font-size="11" font-weight="700">viewpoint is applied via placeCamera().</text>

  <!-- Bottom: schematic of the camera+light setup that's unchanged -->
  <g transform="translate(20, 700)" opacity="0">
    <!-- placeholder so the SVG viewBox extends if needed -->
  </g>
</svg>
