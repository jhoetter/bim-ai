<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Issue #116 — IR site_topo heightSamples + footprintMm passthrough, before vs after</title>
  <desc>
    h22 IR carries a site_topo fact with explicit heightSamples (5.4m N-S drop) +
    footprintMargin (6000mm). Before: _topology_bundle reads only the exterior wall
    chain and re-synthesises slope from a hardcoded per-house table, so the IR's
    heightSamples are silently dropped and the toposolid renders as a flat slab.
    After: _topology_bundle reads the site_topo fact and passes its heightSamples
    + footprintMargin through to CreateToposolid verbatim, so the hillside slope
    survives authoring.
  </desc>

  <defs>
    <linearGradient id="sky2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dbe7f3"/>
      <stop offset="1" stop-color="#f4f7fa"/>
    </linearGradient>
    <pattern id="soilHatch2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#a0805a" stroke-width="1"/>
    </pattern>
    <marker id="arrow116" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="460" fill="#ffffff"/>

  <!-- ============== LEFT: BEFORE ============== -->
  <g id="before-116">
    <rect x="20" y="20" width="520" height="420" fill="url(#sky2)" stroke="#c5cdd6" stroke-width="1"/>
    <text x="280" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Before (#116 symptom)</text>
    <text x="280" y="64" text-anchor="middle" font-size="11" fill="#4b5563">
      _topology_bundle ignores site_topo fact; heightSamples = []
    </text>
    <text x="280" y="78" text-anchor="middle" font-size="11" fill="#4b5563">
      Slope re-synthesised from per-house slope_specs table (h22 not listed → 0)
    </text>

    <!-- Flat toposolid -->
    <rect x="80" y="300" width="420" height="40" fill="url(#soilHatch2)" stroke="#7a5c3c" stroke-width="1.2"/>
    <line x1="80" y1="300" x2="500" y2="300" stroke="#3a2f1f" stroke-width="2"/>
    <text x="290" y="295" text-anchor="middle" font-size="11" fill="#3a2f1f" font-style="italic">flat slab (heightSamples dropped)</text>

    <!-- IR samples (shown but unused) -->
    <g font-size="10" fill="#9ca3af">
      <circle cx="120" cy="240" r="3" fill="#9ca3af"/>
      <text x="118" y="232" text-anchor="end">z=+2700</text>
      <circle cx="200" cy="270" r="3" fill="#9ca3af"/>
      <text x="200" y="262" text-anchor="middle">z=+1400</text>
      <circle cx="330" cy="320" r="3" fill="#9ca3af"/>
      <text x="330" y="335" text-anchor="middle">z=-1400</text>
      <circle cx="440" cy="350" r="3" fill="#9ca3af"/>
      <text x="440" y="365" text-anchor="middle">z=-2700</text>
    </g>
    <text x="280" y="200" text-anchor="middle" font-size="11" fill="#9ca3af" font-style="italic">
      IR heightSamples (silently dropped by driver)
    </text>

    <!-- House silhouette riding the flat slab -->
    <g transform="translate(230,210)">
      <rect x="0" y="40" width="120" height="50" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
      <polygon points="0,40 60,0 120,40" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
      <text x="60" y="105" text-anchor="middle" font-size="10" fill="#374151">house clipping flat lot</text>
    </g>

    <!-- Compass -->
    <g transform="translate(450,400)" font-size="10" fill="#374151">
      <line x1="0" y1="0" x2="50" y2="0" stroke="#374151" marker-end="url(#arrow116)"/>
      <text x="60" y="4">S (downhill)</text>
    </g>
  </g>

  <!-- ============== RIGHT: AFTER ============== -->
  <g id="after-116">
    <rect x="560" y="20" width="520" height="420" fill="url(#sky2)" stroke="#c5cdd6" stroke-width="1"/>
    <text x="820" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">After (this PR)</text>
    <text x="820" y="64" text-anchor="middle" font-size="11" fill="#4b5563">
      site_topo fact piped through to CreateToposolid verbatim
    </text>
    <text x="820" y="78" text-anchor="middle" font-size="11" fill="#4b5563">
      heightSamples + footprintMargin survive authoring; hillside visible
    </text>

    <!-- Sloped toposolid -->
    <polygon points="620,240 1040,360 1040,400 620,280" fill="url(#soilHatch2)" stroke="#7a5c3c" stroke-width="1.2"/>
    <line x1="620" y1="240" x2="1040" y2="360" stroke="#3a2f1f" stroke-width="2"/>
    <text x="830" y="225" text-anchor="middle" font-size="11" fill="#3a2f1f" font-style="italic">tilted toposolid (heightSamples honored)</text>

    <!-- IR samples (now drive the surface) -->
    <g font-size="10" fill="#1f2937">
      <circle cx="660" cy="248" r="3" fill="#0ea5e9"/>
      <text x="658" y="240" text-anchor="end">z=+2700</text>
      <circle cx="740" cy="270" r="3" fill="#0ea5e9"/>
      <text x="740" y="262" text-anchor="middle">z=+1400</text>
      <circle cx="870" cy="312" r="3" fill="#0ea5e9"/>
      <text x="870" y="305" text-anchor="middle">z=-1400</text>
      <circle cx="980" cy="345" r="3" fill="#0ea5e9"/>
      <text x="980" y="338" text-anchor="middle">z=-2700</text>
    </g>

    <!-- House silhouette riding the tilted slab; KG daylight on S side -->
    <g transform="translate(770,170)">
      <rect x="0" y="40" width="120" height="50" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
      <polygon points="0,40 60,0 120,40" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
      <!-- exposed KG band on the downhill side -->
      <rect x="0" y="90" width="120" height="40" fill="#f3f4f6" stroke="#374151" stroke-width="1"/>
      <line x1="80" y1="90" x2="120" y2="130" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 2"/>
      <text x="60" y="148" text-anchor="middle" font-size="10" fill="#374151">KG exposed on downhill side</text>
    </g>

    <!-- Compass -->
    <g transform="translate(990,400)" font-size="10" fill="#374151">
      <line x1="0" y1="0" x2="50" y2="0" stroke="#374151" marker-end="url(#arrow116)"/>
      <text x="-60" y="4" text-anchor="start">S (downhill)</text>
    </g>
  </g>

  <!-- Footer note -->
  <text x="550" y="455" text-anchor="middle" font-size="10" fill="#6b7280">
    Fix: _topology_bundle reads ir.extractedFacts[kind=site_topo] and plumbs heightSamples + footprintMargin into CreateToposolid (closes #116).
  </text>
</svg>
