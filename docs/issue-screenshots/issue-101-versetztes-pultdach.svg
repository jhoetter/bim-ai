<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter,Arial,sans-serif" font-size="13">
  <title>ISSUE-101 — Versetztes Pultdach (offset double mono-pitch with clerestory band)</title>
  <desc>Schematic section view showing the two mono-pitched roof planes at different elevations along the long axis, joined by a horizontal clerestory wall band at the step.</desc>

  <!-- background -->
  <rect x="0" y="0" width="800" height="460" fill="#f6f6f4"/>

  <!-- ground line -->
  <line x1="40" y1="400" x2="760" y2="400" stroke="#5b5b58" stroke-width="2"/>
  <text x="44" y="416" fill="#5b5b58">±0.00 reference level</text>

  <!-- main mass (walls) -->
  <rect x="120" y="280" width="280" height="120" fill="#e4e2dc" stroke="#7a766e" stroke-width="1.5"/>
  <rect x="400" y="220" width="280" height="180" fill="#e4e2dc" stroke="#7a766e" stroke-width="1.5"/>

  <!-- front mono-pitched roof slab -->
  <polygon points="120,280 400,220 400,210 120,270" fill="#8c8a82" stroke="#3f3d38" stroke-width="1.5"/>
  <!-- rear mono-pitched roof slab -->
  <polygon points="400,170 680,140 680,130 400,160" fill="#8c8a82" stroke="#3f3d38" stroke-width="1.5"/>

  <!-- clerestory band (vertical wall between the two slabs) -->
  <rect x="395" y="170" width="10" height="50" fill="#d8c98e" stroke="#3f3d38" stroke-width="1.5"/>
  <line x1="395" y1="170" x2="405" y2="170" stroke="#3f3d38" stroke-width="1"/>
  <line x1="395" y1="220" x2="405" y2="220" stroke="#3f3d38" stroke-width="1"/>

  <!-- dimensions / labels -->
  <line x1="120" y1="440" x2="400" y2="440" stroke="#3f3d38" stroke-width="1"/>
  <line x1="120" y1="435" x2="120" y2="445" stroke="#3f3d38" stroke-width="1"/>
  <line x1="400" y1="435" x2="400" y2="445" stroke="#3f3d38" stroke-width="1"/>
  <text x="240" y="455" fill="#3f3d38" text-anchor="middle">stepPositionAlongLongAxisMm</text>

  <line x1="400" y1="440" x2="680" y2="440" stroke="#3f3d38" stroke-width="1"/>
  <line x1="680" y1="435" x2="680" y2="445" stroke="#3f3d38" stroke-width="1"/>
  <text x="540" y="455" fill="#3f3d38" text-anchor="middle">rear run (longSpan − step)</text>

  <!-- eave height callouts -->
  <line x1="100" y1="270" x2="100" y2="400" stroke="#3f3d38" stroke-width="1"/>
  <line x1="95" y1="270" x2="105" y2="270" stroke="#3f3d38" stroke-width="1"/>
  <line x1="95" y1="400" x2="105" y2="400" stroke="#3f3d38" stroke-width="1"/>
  <text x="90" y="345" fill="#3f3d38" text-anchor="end">frontEaveHeightMm</text>

  <line x1="700" y1="135" x2="700" y2="400" stroke="#3f3d38" stroke-width="1"/>
  <line x1="695" y1="135" x2="705" y2="135" stroke="#3f3d38" stroke-width="1"/>
  <line x1="695" y1="400" x2="705" y2="400" stroke="#3f3d38" stroke-width="1"/>
  <text x="710" y="270" fill="#3f3d38">rearEaveHeightMm</text>

  <!-- clerestory band height callout -->
  <line x1="440" y1="170" x2="440" y2="220" stroke="#3f3d38" stroke-width="1"/>
  <line x1="435" y1="170" x2="445" y2="170" stroke="#3f3d38" stroke-width="1"/>
  <line x1="435" y1="220" x2="445" y2="220" stroke="#3f3d38" stroke-width="1"/>
  <text x="450" y="200" fill="#3f3d38">clerestoryBandHeightMm</text>

  <!-- pitch labels -->
  <text x="240" y="260" fill="#1f2937" font-style="italic">frontPitchDeg</text>
  <text x="520" y="170" fill="#1f2937" font-style="italic">rearPitchDeg</text>

  <!-- title strip -->
  <text x="40" y="32" fill="#1f2937" font-size="18" font-weight="600">Issue #101 — Versetztes Pultdach</text>
  <text x="40" y="54" fill="#3f3d38">RoofGeometryMode = "mono_pitch_offset"</text>
  <text x="40" y="76" fill="#5b5b58">Two mono-pitched planes at different eave heights, partitioned along the long axis, joined by a horizontal clerestory wall band.</text>

  <!-- legend -->
  <rect x="40" y="100" width="14" height="14" fill="#8c8a82" stroke="#3f3d38"/>
  <text x="60" y="112" fill="#3f3d38">roof slab (mono-pitched)</text>
  <rect x="240" y="100" width="14" height="14" fill="#d8c98e" stroke="#3f3d38"/>
  <text x="260" y="112" fill="#3f3d38">clerestory wall band (synthesized at render time)</text>
  <rect x="540" y="100" width="14" height="14" fill="#e4e2dc" stroke="#7a766e"/>
  <text x="560" y="112" fill="#3f3d38">supporting walls (existing)</text>
</svg>
