# Lockfile: app/uv.lock — generated by `uv lock`.
# To update deps: edit pyproject.toml, then run `cd app && uv lock`, then commit both files.
# CI enforces lockfile freshness via `uv lock --check`.

[project]
name = "bim-ai-app"
version = "0.1.0"
description = "BIM AI FastAPI backend (browser-first BIM v1)."
requires-python = ">=3.12"
# DEP-CQ-01: critical deps are pinned to known-tested minor ranges.
# Cadence: review for a minor bump every quarter (next: 2026-08-29).
dependencies = [
    "fastapi>=0.115.1,<0.137",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy[asyncio]>=2.0.25,<2.1",
    "asyncpg>=0.30.0,<0.32",
    "pydantic>=2.9,<2.14",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.12,<1",
    "reportlab>=4.2,<5",
    "numpy>=1.26,<3",
    "bcrypt>=4.0,<5",
    "idna>=3.15",
    "scikit-image>=0.22,<1",
    "mcp[cli]>=1.0",  # MCP transport for the bim-ai tool catalog (Phase A of mcp-native-bim-agent-tracker)
    "starlette>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=6.0,<7",
    "ruff>=0.7,<1",
    "httpx>=0.27,<1",
]

ifc = [
    # Wheels available for many platforms; pin floor for repeatable CI.
    "ifcopenshell>=0.8.1,<0.9",
]

dxf = [
    # FED-04: DXF underlay parser. Pure-Python; no native deps.
    "ezdxf>=1.4,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bim_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "__pycache__", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# tests/api/test_jobs_routes.py: B008 stays — that file uses `Body(...)`
# directly to test ingress validation (BRT-52 reviewed and kept).
"tests/api/test_jobs_routes.py" = ["B008"]
# bim_ai/vg/compare.py: B905 carve-out cleared by BRT-52
# (all `zip(...)` calls now pass explicit `strict=False`).

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=bim_ai --cov-report=term-missing --cov-fail-under=65 -m 'not integration'"
markers = [
    "integration: live-server tests requiring a running API; excluded from standard CI",
]

[tool.coverage.run]
source = ["bim_ai"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.3.0",
    # BRT-40: Python static type checking (gate added in Makefile typecheck-py).
    "mypy>=1.13,<2",
    "mypy-baseline>=0.7,<1",
]

# BRT-40: mypy config.
#
# Strict mode is the *target*; we get there by shrinking the baseline at
# app/mypy-baseline.txt, not by sprinkling `# type: ignore`. Per-module
# overrides below mark areas that are intentionally permissive (tests,
# third-party shims) so the strict-mode noise is contained.
[tool.mypy]
python_version = "3.12"
mypy_path = "."
files = ["bim_ai"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
no_implicit_optional = true
ignore_missing_imports = true
# Modules we explicitly target for `strict = True`. Start tiny — the new
# _io/ helpers — and add modules to this list as we drive their baseline
# entries to zero (BRT-43).
plugins = []

[[tool.mypy.overrides]]
# BRT-43: subpackages held to strict typing. Add modules here as their
# baseline entries are driven to zero. Run `cd app && uv run mypy
# bim_ai/<module>` — if it returns "Success: no issues found", the
# module is ready to graduate to this list.
module = [
    "bim_ai._io.*",
    "bim_ai._errors",
    "bim_ai.models.*",
    "bim_ai.routes.agent_runs",
    "bim_ai.routes.catalogs",
    "bim_ai.routes.concept_seeds",
    "bim_ai.routes.milestones",
    "bim_ai.routes.pixel_map",
    "bim_ai.routes.presentation",
    "bim_ai.routes.query_resolve",
    "bim_ai.routes.render_export",
    "bim_ai.routes.renderer_diagnostics",
    "bim_ai.routes.reverse_bim",
    "bim_ai.routes.schedules",
    "bim_ai.routes.sharing",
    "bim_ai.routes.site_import",
    "bim_ai.routes.sketch_product",
    "bim_ai.routes.time_travel",
    "bim_ai.routes.tokens",
    "bim_ai.routes.ws_bootstrap",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_reexport = false
strict_equality = true
